<!doctype html>
<html lang="en-US">
    {{ partial "head.html" . }}
    <body data-theme="">
        {{ partial "skip-link.html" . }} {{ partial "header.html" . }}
        <main id="main-content" tabindex="-1">
            {{ block "main" . }} {{ end }}
        </main>
        {{ partial "footer.html" . }}
        <!--Town Square snipper-->
        <link rel="preconnect" href="https://townsquare.cauenapier.com" crossorigin />
        <link rel="stylesheet" href="https://townsquare.cauenapier.com/widget.css" />
        <link rel="stylesheet" href="https://townsquare.cauenapier.com/api/sites/site_AZfYFJilQiKx3mk7/style.css" />
        <div id="townsquare-root"></div>
        <script type="module" async>
          import { mountTownSquare } from "https://townsquare.cauenapier.com/townsquare.mjs";

          mountTownSquare(document.getElementById("townsquare-root"), {
            serverOrigin: "https://townsquare.cauenapier.com",
            siteKey: "site_AZfYFJilQiKx3mk7",
            theme: "host"
          });
        </script>
    </body>
    {{ partial "scripts.html" . }}
</html>
