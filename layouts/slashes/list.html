{{ define "main" }}
<article class="[ slashes-section ] [ center ] [ wrapper ] [ flow ]">
    <header class="[ slashes-header ] [ flow ]">
        <h1>Slashes</h1>
        <p>A list of all pages on this site</p>
    </header>
    <div class="[ slashes-list ] [ flow ]">
        {{ range hugo.Data.slashes }}
        <a class="[ slash-entry ] card" href="{{ .url }}">
            <div class="box">
                <h2 class="[ text-h5 ]">{{ .title }}</h2>
                <p>{{ .description }}</p>
                <span class="[ mono-font ]">{{ .url }}</span>
            </div>
        </a>
        {{ end }}
    </div>
</article>
{{ end }}
